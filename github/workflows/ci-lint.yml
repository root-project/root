name: Workflow Lint & Security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        
