name: Maintain GitHub Actions

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve and pin latest Action SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_actions.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci(actions): pin GitHub Actions to latest Node 24+ releases"
          title: "ci(actions): update and SHA-pin GitHub Actions"
          body: |
            ### Automated CI/CD Maintenance
            - Resolved latest upstream releases for all GitHub Actions.
            - Pinned actions to immutable commit SHAs.
            - Validated `.github/dependabot.yml` and workflow YAML objects.
          branch: ci/auto-update-actions
          delete-branch: true
          
