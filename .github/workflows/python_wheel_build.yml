name: 'ROOT Python wheels'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The git ref to build the wheel from (branch, tag, or commit SHA).'
        type: string
        required: true
        default: ''
  schedule:
    - cron: '01 1 * * *'
  pull_request:
    types: [synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-wheels:
    if: |
      (github.repository_owner == 'root-project' &&
       (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch')) ||
      contains(github.event.pull_request.labels.*.name, 'build-python-wheels')
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
        config:
          - runner: macos-15
            platform: macosx_arm64
            deployment_target: "15.0"
          - runner: macos-26
            platform: macosx_arm64
            deployment_target: "26.0"
          - runner: ubuntu-latest
            platform: manylinux_x86_64
            deployment_target: ""
    name: ${{ matrix.python }}-${{ matrix.config.platform }}-${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: ./.github/workflows/cibuildwheel-impl
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.config.deployment_target }}
        with:
          build-tag: ${{ matrix.python }}-${{ matrix.config.platform }}
          artifact-name: ${{ matrix.python }}-${{ matrix.config.platform }}-${{ matrix.config.runner }}

  test-wheels:
    needs: build-wheels
    runs-on: ${{ matrix.test_config.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        test_config:
          # each runner tests the wheel built on it
          - runner: macos-15
            wheel_name_pattern: "macosx_15"
          - runner: macos-26
            wheel_name_pattern: "macosx_26"
          - runner: ubuntu-latest
            wheel_name_pattern: "manylinux"
    name: test-cp${{ matrix.python }}-${{ matrix.test_config.wheel_name_pattern }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Download produced wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install produced wheel
        run: |
          ls -R wheels
          PY_VER=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          WHEEL=$(ls wheels/*${PY_VER}*${{ matrix.test_config.wheel_name_pattern }}*.whl | head -n 1)
          echo "Python version: ${PY_VER}, installing wheel: ${WHEEL}"
          pip install "$WHEEL"

      - name: Install tutorials dependencies
        run: |
          python -m pip install --no-cache-dir -r test/wheels/requirements-ci.txt

      - name: Run tutorials
        run: |
          pytest -vv --verbosity="4" -rF test/wheels

  create-and-upload-wheel-registry:
      if: github.event_name != 'pull_request' # The secrets are not available in PR
      needs: test-wheels
      runs-on: ubuntu-latest
      steps:

      - name: Download produced wheels
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install required system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y krb5-user xrootd-client

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Create PEP503-compliant wheel registry
        run: |
          mkdir -p wheelhouse
          mv *.whl wheelhouse
          python -m pip install --upgrade pip
          python -m pip install --user simple503
          simple503 wheelhouse

      - name: Compute number of files to upload
        id: nfiles
        run: echo "NFILES=$(find wheelhouse -maxdepth 1 | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload wheels to EOS
        env:
          RWEBEOS_KT: ${{ secrets.RWEBEOS_KT }}
          KT_FILE_NAME: /tmp/decoded.keytab
          EOS_PATH: /eos/project/r/root-eos/www/experimental-python-wheels
          EOS_ENDPOINT: root://eosproject-r.cern.ch
          KRB5CCNAME: /tmp/krb5cc
          NFILES: ${{ steps.nfiles.outputs.NFILES }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo +++ Content
          ls
          echo +++ Retrieving the secret
          echo ${RWEBEOS_KT} | base64 -d > ${KT_FILE_NAME}
          echo +++ Creating the token
          kinit  -p ${{ secrets.KRB5USER }}@${{ secrets.KRB5REALM }} -kt ${KT_FILE_NAME}
          echo +++ Running the copy
          xrdcp --parallel ${NFILES} -rf wheelhouse/* ${EOS_ENDPOINT}/${EOS_PATH}/

  publish-to-pypi:
      if: github.event_name == 'workflow_dispatch'
      needs: test-wheels
      runs-on: ubuntu-latest
      name: >-
        Publish Python distribution to PyPI
      environment:
        name: pypi
        url: https://pypi.org/p/root
      permissions:
        id-token: write
      steps:
      - name: Download produced wheels
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
